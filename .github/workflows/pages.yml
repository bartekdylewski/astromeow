name: Pages
# Statyczna wersja gry na GitHub Pages (bez backendu: /api/* zwraca 404, gra to toleruje).
# Konfiguracja repo: docs/github-pages.md
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    # ubuntu-latest działa dopiero, gdy repo jest publiczne (prywatne konto dawało startup_failure)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 pages/make_site.py   # index.html = sprawdzenie serwera, game.html = gra z banerem demo
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
