<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#F7F2FF">
<title>AstroMeow 🐱 Kosmiczny Kot</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" media="print" onload="this.media='all'">
<style>
/* ===== PASTELOWA PALETA ===== */
:root{
  --bg:#F7F2FF; --ink:#3B3459; --muted:#8C86AA; --line:#E7DFFB;
  --lav:#CDBEFF; --lavd:#A18EF0; --lavs:#EFE9FF;
  --mint:#B4EBD0; --mintd:#74CBA2; --mints:#E4F8EE;
  --peach:#FFD0A6; --peachd:#F2A867; --peachs:#FFEFDD;
  --pink:#FFC8D7; --pinkd:#F597B3; --pinks:#FFEAF0;
  --sky:#C2E4FF; --skyd:#86C3F0; --skys:#E6F4FF;
  --butter:#FFF0B3; --butterd:#EBD071;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{font-size:16px}
body{
  font-family:'Nunito',ui-rounded,'Segoe UI',system-ui,-apple-system,sans-serif;color:var(--ink);
  background:radial-gradient(circle at 15% 10%,#FFE2F0 0,transparent 40%),radial-gradient(circle at 88% 18%,#D4EAFF 0,transparent 42%),radial-gradient(circle at 50% 105%,#E2D8FF 0,transparent 50%),#F2ECFF;
  display:flex;align-items:center;justify-content:center;overflow:hidden;-webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;
}
#device{position:relative;width:100%;max-width:100%;height:100vh;height:100dvh;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;flex:none}
@media(min-width:521px){#device{border-radius:2rem;height:calc(100vh - 24px);height:calc(100dvh - 24px);box-shadow:0 1.4rem 4rem #7a63c455,0 0 0 .35rem #fff8}
  #device.full{border-radius:0;height:100vh;height:100dvh;box-shadow:none}}
#app{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 1.1rem;scrollbar-width:none;position:relative;overscroll-behavior:contain}
#app::-webkit-scrollbar{display:none}
.scr{min-height:100%;display:flex;flex-direction:column;padding-top:max(.9rem,env(safe-area-inset-top))}
.scr.fixed{height:100%;min-height:0}
.grow{flex:1}
.foot{position:sticky;bottom:0;margin:auto -1.1rem 0;padding:1.1rem 1.1rem calc(.9rem + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 72%,transparent);z-index:5}
.row{display:flex;align-items:center}.col{display:flex;flex-direction:column}.between{justify-content:space-between}.center{align-items:center;justify-content:center}
.col.center{justify-content:flex-start}
.gap{gap:.75rem}.gap-s{gap:.4rem}.tc{text-align:center}.w100{width:100%}
.mt{margin-top:1rem}.mt-s{margin-top:.5rem}.mt-l{margin-top:1.5rem}.mb{margin-bottom:1rem}.mb-s{margin-bottom:.5rem}
.muted{color:var(--muted);font-weight:800}
h1,h2,h3{margin:0}

/* ===== NAV ===== */
#nav{flex:none;display:grid;grid-template-columns:repeat(5,1fr);gap:.25rem;padding:.4rem .6rem calc(.5rem + env(safe-area-inset-bottom));background:#fff;border-top:2px solid var(--line)}
#nav.hide{display:none}
#nav button{border:0;background:none;font:inherit;font-weight:900;font-size:.72rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:.1rem;padding:.35rem 0;border-radius:1rem;cursor:pointer}
#nav button span{font-size:1.5rem;line-height:1}
#nav button.on{background:var(--lavs);color:#6A55D8}

/* ===== PRZYCISKI ===== */
.btn{position:relative;display:block;width:100%;min-height:3.7rem;border:0;border-bottom:.28rem solid;border-radius:1.15rem;padding:.8rem 1rem;font:inherit;font-weight:900;font-size:1.05rem;letter-spacing:.02em;color:var(--ink);cursor:pointer;text-align:center;transition:transform .08s,border-bottom-width .08s;user-select:none}
.btn:active:not(:disabled){transform:translateY(.2rem);border-bottom-width:.08rem}
.btn:disabled{background:#E8E4F3!important;border-color:#D5D0E8!important;color:#ABA5C6;cursor:not-allowed}
.btn small{display:block;font-weight:800;font-size:.8rem;opacity:.75;margin-top:.1rem}
.b-lav{background:var(--lav);border-color:var(--lavd)}
.b-mint{background:var(--mint);border-color:var(--mintd)}
.b-peach{background:var(--peach);border-color:var(--peachd)}
.b-pink{background:var(--pink);border-color:var(--pinkd)}
.b-sky{background:var(--sky);border-color:var(--skyd)}
.b-white{background:#fff;border:2px solid var(--line);border-bottom-width:.28rem}
.btn.sm{min-height:2.8rem;font-size:.92rem;padding:.5rem .8rem}
.link{border:0;background:none;font:inherit;font-weight:800;font-size:.8rem;color:var(--muted);text-decoration:underline;cursor:pointer;padding:.5rem}
.x{border:0;background:#fff;width:2.6rem;height:2.6rem;border-radius:50%;font:inherit;font-weight:900;font-size:1.15rem;color:var(--muted);cursor:pointer;box-shadow:0 .15rem 0 var(--line);flex:none}

/* ===== KARTY ===== */
.card{background:#fff;border:2px solid var(--line);border-radius:1.4rem;padding:1rem}
.pill{display:inline-flex;align-items:center;gap:.25rem;border-radius:99px;padding:.3rem .75rem;font-weight:900;font-size:.85rem;white-space:nowrap;border:0;font-family:inherit;color:var(--ink)}
button.pill{cursor:pointer}
.pk{background:var(--peachs);color:#B8691F}.lv{background:var(--lavs);color:#5B47C9}.gr{background:var(--mints);color:#2D8F66}.rd{background:var(--pinks);color:#C84A6C}.sk{background:var(--skys);color:#2F7FB8}.bt{background:var(--butter);color:#8A6D12}
.meter{height:.8rem;background:#ECE6FB;border-radius:99px;overflow:hidden}
.meter>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--lavd),var(--pinkd));transition:width .45s}
.label{font-size:.75rem;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:#7E69E0}
.logo{font-size:2.7rem;font-weight:900;letter-spacing:-.02em;line-height:1}
.logo span{background:linear-gradient(90deg,#8E78F5,#F28CB0);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:.3rem 0 0;font-weight:800;color:var(--muted)}
.hint{text-align:center;font-weight:800;font-size:.82rem;color:var(--muted);margin:.5rem 0 .6rem}
.bubble{position:relative;background:#fff;border-radius:1.3rem;padding:.7rem 1rem;font-weight:800;box-shadow:0 .2rem 0 var(--line);font-size:.95rem;line-height:1.3}
.bubble::after{content:'';position:absolute;left:-.6rem;top:50%;transform:translateY(-50%);border:.6rem solid transparent;border-right-color:#fff;border-left:0}
.bubble.up::after{left:50%;top:-.55rem;transform:translateX(-50%);border:.6rem solid transparent;border-bottom-color:#fff;border-top:0;border-right-color:transparent}
.bubble.line{min-height:2.6rem;display:flex;align-items:center;flex:1}
.stat{background:#fff;border:2px solid var(--line);border-radius:1.2rem;padding:.7rem .5rem;text-align:center}
.stat b{display:block;font-size:1.35rem;font-weight:900}.stat small{font-weight:800;color:var(--muted);font-size:.72rem}.stat .ic{font-size:1.6rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
</style>
<style>
/* ===== KOT ===== */
.cat{display:inline-block;flex:none;position:relative}
.cat img,.cat svg{width:100%;height:100%;display:block;object-fit:contain}
.cat.p-idle:not(.ext){animation:breathe 2.8s ease-in-out infinite}
.cat.p-happy:not(.ext){animation:hop .6s ease-in-out 3}
.cat.p-cheer:not(.ext){animation:hop .45s ease-in-out infinite}
.cat.p-sad:not(.ext){animation:droop 2.2s ease-in-out infinite}
.cat.p-think:not(.ext){animation:tilt 2.4s ease-in-out infinite}
.cat.shake{animation:shake .45s}
.float{animation:float 3.2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-.7rem)}}
@keyframes droop{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(.25rem) rotate(-3deg)}}
@keyframes tilt{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-.5rem)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-.5rem)}75%{transform:translateX(.5rem)}}
.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.bounce{animation:hop 1.3s ease-in-out infinite}
.wiggle{animation:wiggle .5s}@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.flame{display:inline-block;animation:flame 1.4s ease-in-out infinite}@keyframes flame{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.15) rotate(3deg)}}
.idle{animation:float 3s ease-in-out infinite}

.cfx{display:block;width:100%;height:100%}
.cacc{position:absolute;left:50%;top:-14%;transform:translateX(-50%) rotate(-8deg);line-height:1;pointer-events:none;filter:drop-shadow(0 .12rem 0 rgba(0,0,0,.18));z-index:2}
</style>
<style>
/* ===== QUIZ ===== */
.heart{font-size:1.65rem;transition:transform .3s,filter .3s;display:inline-block}
.heart.off{filter:grayscale(1) opacity(.28);transform:scale(.8)}
.ans{width:100%;text-align:left;border-radius:1.2rem;padding:.8rem 1rem;min-height:3.7rem;display:flex;align-items:center;gap:.75rem;font:inherit;font-weight:800;font-size:1.05rem;color:var(--ink);background:#fff;border:2px solid var(--line);border-bottom-width:.25rem;cursor:pointer}
.ans .L{width:2.1rem;height:2.1rem;border-radius:.8rem;display:flex;align-items:center;justify-content:center;font-weight:900;background:var(--lavs);color:#5B47C9;flex:none}
.ans:disabled{cursor:default;color:var(--ink)}
.qtext{font-size:1.65rem;font-weight:900;line-height:1.18;margin:.2rem 0 1rem}
.fb{border-radius:1.3rem;padding:.8rem 1rem;margin-bottom:.8rem}
.fb b{display:block;font-size:1.15rem;font-weight:900}
.fb p{margin:.2rem 0 0;font-weight:700;font-size:.9rem;color:#5B5578}
.fb.ok{background:var(--mints);border:2px solid var(--mint)}.fb.ok b{color:#2D8F66}
.fb.no{background:var(--pinks);border:2px solid var(--pink)}.fb.no b{color:#C84A6C}
.diffchip{font-size:.7rem}

.heart.gold{filter:drop-shadow(0 0 .35rem #FFD76A)}
</style>
<style>
/* ===== MISJE / SALON ===== */
.mission{display:flex;align-items:center;gap:.9rem;padding:.9rem;border-radius:1.5rem;background:#fff;border:2px solid var(--line);border-bottom-width:.35rem;cursor:pointer;width:100%;font:inherit;color:var(--ink);text-align:left;margin-bottom:.8rem}
.mission:disabled{opacity:.55;cursor:not-allowed}
.mission .ic{width:3.7rem;height:3.7rem;border-radius:1.2rem;display:flex;align-items:center;justify-content:center;font-size:2rem;flex:none}
.gtile{border:2px solid var(--line);border-bottom-width:.3rem;background:#fff;border-radius:1.3rem;padding:.8rem .5rem;font:inherit;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.15rem;text-align:center}
.gtile span{font-size:2rem}.gtile b{font-size:.85rem;font-weight:900;line-height:1.1}.gtile small{font-weight:800;color:var(--muted);font-size:.7rem}
.diffbtn{display:flex;align-items:center;gap:1rem;text-align:left}
.rec{position:absolute;top:-.6rem;right:.9rem;background:#fff;color:#7E69E0;font-size:.62rem;font-weight:900;letter-spacing:.06em;border-radius:99px;padding:.12rem .6rem;border:2px solid var(--lav)}
.dots{display:flex;gap:.4rem;justify-content:center}.dots i{width:.9rem;height:.9rem;border-radius:50%;background:#E3DCF7}.dots i.on{background:var(--lavd)}.dots i.ok{background:var(--mintd)}
.promo{background:linear-gradient(135deg,var(--butter),var(--peachs));border:2px solid var(--butterd);border-radius:1.4rem;padding:.8rem 1rem;font-weight:900;text-align:center}
.diffbtn .big{font-size:2.4rem}.diffbtn b{font-size:1.3rem;display:block}

/* ===== MAPA MISJI (jak w Duolingo) ===== */
.tierhead{display:flex;align-items:center;justify-content:center;gap:.5rem;margin:1.1rem auto .2rem;padding:.45rem 1.2rem;border-radius:99px;font-weight:900;width:max-content;max-width:100%;border:2px solid #fff;box-shadow:0 .25rem 0 #0001}
.pathbox{position:relative;width:100%}
.pathbox svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.pnode{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:.25rem;background:none;border:0;font:inherit;color:var(--ink);cursor:pointer;width:9.5rem;padding:0}
.pnode .c{width:4.8rem;height:4.8rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.2rem;border:.2rem solid #fff;box-shadow:0 .4rem 0 rgba(0,0,0,.16);transition:transform .1s}
.pnode:active .c{transform:translateY(.2rem)}
.pnode.cur .c{width:5.8rem;height:5.8rem;font-size:2.8rem;animation:ring 1.6s ease-out infinite}
@keyframes ring{0%{box-shadow:0 .4rem 0 rgba(0,0,0,.16),0 0 0 0 rgba(161,142,240,.7)}100%{box-shadow:0 .4rem 0 rgba(0,0,0,.16),0 0 0 1.3rem rgba(161,142,240,0)}}
.pnode small{font-weight:900;font-size:.74rem;line-height:1.15;text-align:center;background:#ffffffd9;border-radius:.7rem;padding:.1rem .45rem}
.pnode.lock .c{background:#E6E1F2!important;filter:grayscale(.4)}.pnode.lock small{opacity:.6}
.start{background:#fff;color:#7E69E0;border:2px solid var(--lav);border-radius:99px;font-weight:900;font-size:.72rem;padding:.1rem .7rem;animation:float 1.6s ease-in-out infinite}
.pcat{position:absolute;transform:translate(-50%,-50%);pointer-events:none}
.pcard{display:flex;align-items:center;gap:.9rem;width:100%;font:inherit;color:var(--ink);text-align:left;cursor:pointer;background:#fff;border:2px solid var(--line);border-bottom-width:.35rem;border-radius:1.5rem;padding:.8rem 1rem}
.pcard b{display:block;font-size:1.05rem;font-weight:900}.pcard small{display:block;font-weight:800;font-size:.8rem;color:var(--muted);line-height:1.2}
.pcard.hot{background:var(--butter);border-color:var(--butterd)}
.pchip{flex:1;display:flex;flex-direction:column;align-items:center;gap:.05rem;border:2px solid var(--line);border-bottom-width:.3rem;background:#fff;border-radius:1.2rem;padding:.4rem .2rem;font:inherit;color:var(--ink);cursor:pointer}
.pchip span{font-size:1.7rem;line-height:1.1}.pchip small{font-weight:900;font-size:.68rem;color:var(--muted)}
.pchip.on{border-color:var(--lavd);background:var(--lavs)}.pchip.lk{opacity:.55}
.nudge{animation:nudge 1.4s ease-in-out infinite}@keyframes nudge{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.pulse{animation:pulseT 1.3s ease-in-out infinite}@keyframes pulseT{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.9)}50%{box-shadow:0 0 0 .6rem rgba(255,255,255,0)}}
.paw{position:absolute;transform:translate(-50%,-50%) rotate(var(--r,0deg));font-size:1.15rem;opacity:.3;filter:grayscale(1);pointer-events:none}
.paw.on{opacity:1;filter:none}
.tierhead.abs{position:absolute;left:50%;transform:translate(-50%,-50%);margin:0;z-index:2;white-space:nowrap}
.pnode.planet{width:12.5rem}
.pnode.planet .c{width:6.4rem;height:6.4rem;font-size:3.3rem;border-color:var(--butterd);border-width:.28rem}
.pnode.planet small b{font-size:.82rem}
</style>
<style>
/* ===== TUTORIAL ===== */
.tutov{position:absolute;inset:0;z-index:80;background:rgba(59,52,89,.6);display:flex;align-items:center;justify-content:center;padding:1.2rem}
.tutcard{width:100%;max-width:28rem;background:#fff;border-radius:2rem;padding:1.3rem 1.3rem 1.1rem;text-align:center;animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.tutcard h3{font-size:1.5rem;font-weight:900;margin:.2rem 0}.tutcard p{font-weight:700;color:#5B5578;margin:.3rem 0 .9rem;font-size:1.02rem;line-height:1.3}
</style>
<style>
/* ===== EFEKTY ===== */
.confetti{position:absolute;top:-2.5rem;font-size:1.6rem;pointer-events:none;z-index:60;animation:fall 2.3s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
.toast{position:absolute;left:50%;bottom:6rem;transform:translateX(-50%);width:88%;z-index:70;border-radius:1.2rem;padding:.8rem 1rem;font-weight:900;text-align:center;color:var(--ink)}
.toast.ok{background:var(--mint)}.toast.no{background:var(--pink)}
.floatup{position:absolute;left:50%;top:8%;font-size:1.3rem;font-weight:900;pointer-events:none;animation:floatUp 1.3s ease-out forwards;z-index:5}
@keyframes floatUp{0%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,-2.6rem);opacity:0}}
.sheet{position:absolute;inset:0;z-index:50;background:rgba(59,52,89,.35);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{width:100%;background:#fff;border-radius:2rem 2rem 0 0;padding:1.2rem 1.2rem 2rem;max-height:85%;overflow-y:auto;animation:slideUp .35s cubic-bezier(.2,1.2,.4,1)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.grab{width:3rem;height:.35rem;border-radius:99px;background:var(--line);margin:0 auto 1rem}
</style>
<style>
/* ===== BAZA ===== */
.sky{background:linear-gradient(180deg,#A9BBFF 0%,#CDBEFF 55%,#F6CBE6 100%);border-radius:1.8rem;padding:2.8rem .8rem 1rem;position:relative;overflow:hidden;box-shadow:0 .4rem 0 var(--lavd)}
.sky::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle at 12% 22%,#fff 1px,transparent 1.8px),radial-gradient(circle at 78% 18%,#fffc 1px,transparent 1.8px),radial-gradient(circle at 60% 60%,#fff 1px,transparent 1.8px),radial-gradient(circle at 26% 70%,#fffc 1px,transparent 1.8px),radial-gradient(circle at 92% 50%,#fff 1px,transparent 1.8px)}
.ground{transform:rotateX(32deg);transform-style:preserve-3d;display:grid;gap:.5rem;padding:.5rem;position:relative}
.tile{position:relative;aspect-ratio:1/1;border-radius:1rem;display:flex;flex-direction:column;align-items:center;justify-content:center;border:0;cursor:pointer;transition:transform .1s;font:inherit}
.tile:active{filter:brightness(.93)}   /* bez transform: w 3D przesunięcie gubiło kliknięcia */
.badge{position:absolute;width:1.7rem;height:1.7rem;border-radius:99px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:.95rem;box-shadow:0 .2rem 0 #0002;z-index:3}
.res{background:#fff;border:2px solid var(--line);border-radius:1.2rem;padding:.6rem;text-align:center}
.res .e{font-size:1.8rem}.res b{display:block;font-size:1.15rem;font-weight:900}.res small{font-size:.7rem;font-weight:900}
</style>
<style>
/* ===== GRY ===== */
.cvbox{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;border-radius:1.6rem;touch-action:none;box-shadow:0 .3rem 0 var(--lavd)}
.pkroot{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;align-items:center;gap:.5rem;touch-action:none;user-select:none;-webkit-user-select:none}
.rocket{position:relative;display:flex;flex-direction:column;align-items:center}
.nose{background:linear-gradient(180deg,var(--pinkd),var(--pink));clip-path:polygon(50% 0,100% 100%,0 100%);margin-bottom:-2px}
.rbody{position:relative;isolation:isolate;background:#fff;border:.22rem solid var(--lavd);border-radius:1rem 1rem .8rem .8rem;padding:.4rem}
.fin{position:absolute;bottom:.2rem;width:2rem;height:3rem;background:var(--pink);z-index:-1}
.fin.l{left:-1.4rem;clip-path:polygon(100% 0,100% 100%,0 100%)}
.fin.r{right:-1.4rem;clip-path:polygon(0 0,100% 100%,0 100%)}
.bay{position:relative;background:var(--lavs);border-radius:.5rem}
.bcell{position:absolute;border:1px dashed #CBBFF2;border-radius:.3rem}
.pc{position:relative;touch-action:none;cursor:grab}
.pc.placed{position:absolute}
.pc.drag{position:absolute;z-index:20;filter:drop-shadow(0 .5rem .4rem #3B345955)}
.pc.ghost{position:absolute;opacity:.5;pointer-events:none}
.pc.ghost.bad{filter:grayscale(1) sepia(1) hue-rotate(300deg) saturate(3)}
.pcell{position:absolute;border:3px solid;border-radius:.45rem;display:flex;align-items:center;justify-content:center}
.tray{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;align-items:center;align-content:center;min-height:0;flex:1;width:100%;padding:.3rem}
.slot{display:flex;align-items:center;justify-content:center;background:#fff;border-radius:1rem;border:2px dashed var(--line);padding:.3rem}
</style>
</head>
<body>
<div id="device">
  <main id="app"></main>
  <nav id="nav" class="hide">
    <button data-act="tab" data-arg="home"><span>🏠</span>Menu</button>
    <button data-act="tab" data-arg="map"><span>🗺️</span>Misje</button>
    <button data-act="tab" data-arg="base"><span>🛰️</span>Baza</button>
    <button data-act="tab" data-arg="shop"><span>🛍️</span>Sklep</button>

<script>
'use strict';
/* ===================== PAKOWANIE RAKIETY (układanie klocków) ===================== */
const PC_COL = [['#CDBEFF', '#A18EF0'], ['#B4EBD0', '#74CBA2'], ['#FFD0A6', '#F2A867'], ['#FFC8D7', '#F597B3'], ['#C2E4FF', '#86C3F0'], ['#FFF0B3', '#EBD071']];
const PC_EMO = ['🔋', '🥫', '🧪', '🛰️', '🔧', '📡', '🧰', '🪴'];
function normalize(cells) {
  const mx = Math.min(...cells.map(c => c[0])), my = Math.min(...cells.map(c => c[1]));
  const cs = cells.map(([x, y]) => [x - mx, y - my]);
  return { cells: cs, w: Math.max(...cs.map(c => c[0])) + 1, h: Math.max(...cs.map(c => c[1])) + 1 };
}
function rotatePiece(p) { Object.assign(p, normalize(p.cells.map(([x, y]) => [-y, x]))); }
function genPuzzle({ w, h, n, slack }) {
  let pcs = null;
  for (let tr = 0; tr < 60; tr++) {
    const id = Array.from({ length: h }, () => Array(w).fill(-1)), all = [];
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) all.push([x, y]);
    shuffle(all).slice(0, n).forEach(([x, y], i) => id[y][x] = i);
    let left = w * h - n;
    while (left > 0) for (const i of shuffle([...Array(n).keys()])) {
      if (left <= 0) break;
      const fr = [];
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (id[y][x] === i)
        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const X = x + dx, Y = y + dy; if (X >= 0 && Y >= 0 && X < w && Y < h && id[Y][X] === -1) fr.push([X, Y]); }
      if (!fr.length) continue;
      const [X, Y] = pick(fr); id[Y][X] = i; left--;
    }
    pcs = Array.from({ length: n }, (_, i) => { const c = []; for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (id[y][x] === i) c.push([x, y]); return c; });
    const sz = pcs.map(c => c.length);
    if (Math.min(...sz) >= 2 && Math.max(...sz) <= 5) break;
  }
  pcs.sort((a, b) => a.length - b.length);
  while (w * h - pcs.reduce((a, c) => a + c.length, 0) < slack && pcs.length > 3) pcs.shift();
  const cols = shuffle(PC_COL), emo = shuffle(PC_EMO);
  return pcs.map((c, i) => {
    const p = { id: i, ...normalize(c), emoji: emo[i % emo.length], color: cols[i % cols.length][0], dark: cols[i % cols.length][1], at: null };
    for (let r = Math.random() * 4 | 0; r > 0; r--) rotatePiece(p);
    return p;
  });
}
function startPack() {
  const p = GP[P.diff].pack;
  show(gameShell('pack', `<div class="pkroot" id="pkroot">
      <div class="rocket" id="rocket"><div class="nose" id="nose"></div>
        <div class="rbody" id="rbody"><span class="fin l"></span><span class="fin r"></span><div class="bay" id="bay"></div></div>
        <div class="flame" style="font-size:1.6rem;line-height:1;margin-top:-.2rem">🔥</div></div>
      <div class="tray" id="tray"></div></div>`));
  PK = { w: p.w, h: p.h, pieces: genPuzzle(p), t: 0, limit: p.limit, drag: null, over: false, cell: 48, tc: 32 };
  PK.timer = setInterval(() => {
    if (!PK || PK.over) return; PK.t += .25;
    const hud = $('#hud'); if (hud) hud.textContent = `📦 ${PK.pieces.filter(x => x.at).length}/${PK.pieces.length} · ⏱️ ${Math.max(0, Math.ceil(PK.limit - PK.t))}`;
    if (PK.t >= PK.limit) endPack(false);

}
function layoutPack() {

  const W = root.clientWidth, H = root.clientHeight;
  const rem = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
  PK.cell = Math.floor(Math.max(24, Math.min(W * .7 / PK.w, H * .58 / (PK.h + 1.6), 4.4 * rem)));
  PK.tc = Math.floor(PK.cell * .62);

  renderPack();
}
function pieceEl(p, cell) {
  const el = document.createElement('div'); el.className = 'pc'; el.dataset.id = p.id;
  el.style.width = p.w * cell + 'px'; el.style.height = p.h * cell + 'px';
  p.cells.forEach(([x, y], i) => {
    const c = document.createElement('div'); c.className = 'pcell';
    c.style.cssText = `left:${x * cell}px;top:${y * cell}px;width:${cell}px;height:${cell}px;background:${p.color};border-color:${p.dark};font-size:${cell * .55}px`;

}
function renderPack() {

  bay.innerHTML = ''; tray.innerHTML = '';
  for (let y = 0; y < PK.h; y++) for (let x = 0; x < PK.w; x++) {
    const c = document.createElement('div'); c.className = 'bcell';
    c.style.cssText = `left:${x * PK.cell}px;top:${y * PK.cell}px;width:${PK.cell}px;height:${PK.cell}px`; bay.appendChild(c);
  }
  PK.pieces.forEach(p => {

    if (p.at) { const el = pieceEl(p, PK.cell); el.classList.add('placed'); el.style.left = p.at.x * PK.cell + 'px'; el.style.top = p.at.y * PK.cell + 'px'; bay.appendChild(el); }
    else { const s = document.createElement('div'); s.className = 'slot'; s.appendChild(pieceEl(p, PK.tc)); tray.appendChild(s); }
  });

}
function occGrid(skip) {
  const g = Array.from({ length: PK.h }, () => Array(PK.w).fill(false));
  PK.pieces.forEach(p => { if (p !== skip && p.at) p.cells.forEach(([x, y]) => g[p.at.y + y][p.at.x + x] = true); });
  return g;
}
function canPlace(p, gx, gy) {
  const g = occGrid(p);
  return p.cells.every(([x, y]) => { const X = gx + x, Y = gy + y; return X >= 0 && Y >= 0 && X < PK.w && Y < PK.h && !g[Y][X]; });
}
function pkDown(e) {
  const el = e.target.closest('.pc'); if (!el || !PK || PK.over || PK.drag) return;
  const p = PK.pieces.find(q => q.id == el.dataset.id); if (!p) return;
  e.preventDefault();
  const r = el.getBoundingClientRect();
  PK.drag = { p, sx: e.clientX, sy: e.clientY, u: (e.clientX - r.left) / r.width, v: (e.clientY - r.top) / r.height, moved: false, el: null, ghost: null, gx: null, gy: null };

}
function pkMove(e) {
  const d = PK && PK.drag; if (!d) return;
  if (!d.moved) {
    if (Math.hypot(e.clientX - d.sx, e.clientY - d.sy) < 8) return;
    d.moved = true; d.p.at = null; renderPack();
    d.el = pieceEl(d.p, PK.cell); d.el.classList.add('drag'); $('#pkroot').appendChild(d.el);
    d.ghost = pieceEl(d.p, PK.cell); d.ghost.classList.add('ghost'); $('#bay').appendChild(d.ghost);
  }
  const root = $('#pkroot').getBoundingClientRect(), bay = $('#bay').getBoundingClientRect();

  const left = e.clientX - root.left - d.u * pw, top = e.clientY - root.top - d.v * ph - PK.cell * .7;
  d.el.style.left = left + 'px'; d.el.style.top = top + 'px';
  d.gx = Math.round((left - (bay.left - root.left)) / PK.cell); d.gy = Math.round((top - (bay.top - root.top)) / PK.cell);
  d.ghost.style.left = d.gx * PK.cell + 'px'; d.ghost.style.top = d.gy * PK.cell + 'px';
  d.ghost.classList.toggle('bad', !canPlace(d.p, d.gx, d.gy));

function statCard(k, r) {
  const pct = Math.min(100, P.res[k] / goalFor(k) * 100);
  return `<div class="res"><div class="e">${RES[k].icon}</div><b id="v-${k}">${fmt(P.res[k])}</b><small style="color:${RES[k].color}">${RES[k].name}</small>
    <div class="meter" style="height:.5rem;margin-top:.4rem"><i id="m-${k}" style="width:${pct}%;background:${RES[k].color}"></i></div>
    <small style="color:${RES[k].color}" id="r-${k}">+${fmt(r[k])}/s</small></div>`;
}
function updateStats() {
  const r = rates();
  for (const k of ['wiedza', 'czesci', 'meteo']) {
    const v = $('#v-' + k); if (!v) break;
    v.textContent = fmt(P.res[k]); $('#m-' + k).style.width = Math.min(100, P.res[k] / goalFor(k) * 100) + '%'; $('#r-' + k).textContent = '+' + fmt(r[k]) + '/s';
  }
}
function openBuildMenu(x, y) {
  pendingXY = { x, y }; const pi = P.planet, pm = PLANETS[pi].pm;
  const cards = Object.keys(TYPES).map(k => {
    const def = TYPES[k], locked = doneCount() < def.req;
    const gain = Object.keys(def.prod).map(r => `${RES[r].icon}+${fmt(def.prod[r] * pm)}/s`).join(' ') || `✨ +${Math.round(def.aura * 100)}% aury`;
    return `<button data-act="place" data-arg="${k}" style="background:${def.bg};border:0;border-radius:1.4rem;padding:.8rem;display:flex;flex-direction:column;align-items:center;gap:.3rem;font:inherit;color:var(--ink);cursor:pointer;box-shadow:0 .3rem 0 #0002;${locked ? 'opacity:.5' : ''}">
      <div style="font-size:2.6rem">${locked ? '🔒' : def.icon}</div><b style="font-size:.9rem">${def.name}</b>
      ${locked ? `<span class="pill bt">${def.req} ${misPl(def.req)}</span>` : `<small style="font-weight:900;color:#2D8F66">${gain}</small><div style="display:flex;flex-wrap:wrap;gap:.25rem;justify-content:center">${chips(placeCost(k, pi))}</div>`}</button>`;
  }).join('');
  openSheet(`<h3 class="tc mb" style="font-size:1.5rem;font-weight:900">Postaw budynek</h3><div class="grid2">${cards}</div>`);
}
function placeBuilding(type) {
  const def = TYPES[type], pi = P.planet; if (!pendingXY) return;
  if (doneCount() < def.req) return toast('🔒 Zalicz więcej misji!', false);
  const c = placeCost(type, pi);
  if (!canAfford(c)) return toast('Za mało zasobów 😢', false);
  pay(c); pGrid(pi)[key(pendingXY.x, pendingXY.y)] = { type, level: 1, addons: [] };
  save(); closeSheet(); confetti(14);
  if (pFull(pi)) { confetti(40, ['🎉', '🪐', '⭐', '🚀']); toast('🎉 Planeta zabudowana!'); }
  renderBase();
}
function openBuilding(x, y) {
  pendingXY = { x, y }; const pi = P.planet;
  const t = tileAt(x, y), def = TYPES[t.type], rt = buildingRates(t, pi);
  const prod = Object.keys(rt).map(k => `<span class="pill lv">${RES[k].icon} +${fmt(rt[k])}/s</span>`).join(' ') || `<span class="pill lv">✨ aura +${Math.round(Math.min(1, def.aura * t.level) * 100)}% dla planety</span>`;
  const isMax = t.level >= def.max, cost = upgradeCost(t, pi), can = canAfford(cost);
  const up = isMax ? `<div class="tc mb" style="font-weight:900;font-size:1.3rem">👑 MAX</div>`
    : `<button class="btn ${can ? 'b-peach' : ''} mb" data-act="upgrade" ${can ? '' : 'disabled'}>⬆️ ULEPSZ · ${Object.keys(cost).map(k => RES[k].icon + fmt(cost[k])).join(' ')}</button>`;
  const slots = [0, 1].map(i => {
    const need = i === 0 ? 1 : 3;
    if (t.addons[i]) return `<div style="width:5rem;height:5rem;border-radius:1.4rem;display:flex;align-items:center;justify-content:center;font-size:2.4rem;background:${def.bg}">${ADDONS[t.addons[i]].icon}</div>`;
    if (t.level < need) return `<div style="width:5rem;height:5rem;border-radius:1.4rem;background:#F1EEFB;display:flex;align-items:center;justify-content:center;font-size:2rem">🔒</div>`;
    return `<button data-act="slot" style="width:5rem;height:5rem;border-radius:1.4rem;border:2px dashed var(--lavd);font:inherit;font-size:2.2rem;font-weight:900;color:var(--lavd);background:var(--lavs);cursor:pointer">＋</button>`;
  }).join('');
  openSheet(`<div class="col center gap-s mb">
      <div class="idle" style="width:7rem;height:7rem;border-radius:2rem;background:${def.bg};display:flex;align-items:center;justify-content:center;font-size:3.6rem">${def.icon}</div>
      <b style="font-size:1.3rem">${def.name}</b>
      <div style="font-size:1.1rem">${'⭐'.repeat(t.level)}<span style="opacity:.25">${'⭐'.repeat(def.max - t.level)}</span></div>
      <div class="row gap-s" style="flex-wrap:wrap;justify-content:center">${prod}</div></div>
    ${up}<div class="label tc mb-s">Dodatki (poziom 1 i 3)</div><div class="row gap" style="justify-content:center">${slots}</div>`);
}
function upgradeBuilding() {
  const t = tileAt(pendingXY.x, pendingXY.y), c = upgradeCost(t, P.planet);
  if (!canAfford(c)) return toast('Za mało zasobów 😢', false);
  pay(c); t.level++; save(); closeSheet(); confetti(10); renderBase();
}
function openAddonPicker() {
  const pi = P.planet;
  const cards = Object.keys(ADDONS).map(k => {
    const a = ADDONS[k];
    return `<button data-act="addon" data-arg="${k}" style="background:var(--lavs);border:2px solid var(--line);border-radius:1.4rem;padding:.7rem .3rem;display:flex;flex-direction:column;align-items:center;gap:.3rem;font:inherit;color:var(--ink);cursor:pointer">
      <div style="font-size:2.4rem">${a.icon}</div><b>${a.name}</b><b style="color:#2D8F66;font-size:.85rem">+${Math.round(a.mult * 100)}%</b><div style="display:flex;flex-wrap:wrap;gap:.2rem;justify-content:center">${chips(addonCost(k, pi))}</div></button>`;
  }).join('');
  openSheet(`<h3 class="tc mb" style="font-size:1.5rem;font-weight:900">Dodatek</h3><div class="grid3">${cards}</div>`);
}
function addAddon(id) {
  const t = tileAt(pendingXY.x, pendingXY.y); if (t.addons.length >= 2) return;
  const c = addonCost(id, P.planet);
  if (!canAfford(c)) return toast('Za mało zasobów 😢', false);
  pay(c); t.addons.push(id); save(); closeSheet(); confetti(8); renderBase();
}
</script>
<script>
'use strict';
/* ===================== SKLEP: skiny i złote życie ===================== */
function renderShop() {
  stopGame(); cur = renderShop;
  const cards = SKINS.map(sk => {
    const own = P.skins.includes(sk.id), on = P.skin === sk.id;
    const btn = on ? '<span class="pill gr">✓ założony</span>' : own ? `<button class="btn sm b-mint" data-act="equip" data-arg="${sk.id}">ZAŁÓŻ</button>` : `<button class="btn sm b-peach" data-act="buyskin" data-arg="${sk.id}">⭐ ${sk.p}</button>`;
    return `<div class="card tc" style="padding:.9rem .5rem .7rem;${on ? 'border-color:var(--mintd)' : ''}"><div class="col center" style="min-height:5.4rem;justify-content:flex-end">${cat('idle', 5, '', sk.id)}</div>
      <b style="display:block;font-size:.95rem;margin:.4rem 0">${sk.n}</b>${btn}</div>`;
  }).join('');
  show(`<div class="scr">
    ${bar('<h1 style="font-size:1.8rem;font-weight:900">Sklep</h1>', '', `<span class="row gap-s">${starPill()}<button class="x" data-act="tut" data-arg="shop">?</button></span>`)}
    <div class="card tc mb" style="padding:1rem .5rem"><div class="col center" style="min-height:8.5rem;justify-content:flex-end">${cat('happy', 8)}</div><b style="display:block;font-size:1.1rem;margin-top:.5rem">${skinOf().n}</b></div>
    <div class="pcard hot mb"><span style="font-size:2.4rem">💛</span><span class="grow"><b>Złote życie · ${GOLD_PRICE} ⭐</b><small>4. serce na jedną misję. Masz: ${P.golden}. Włączysz je przed startem misji.</small></span>
      <button class="btn sm b-peach" style="width:auto;padding:.5rem 1rem" data-act="buygold">KUP</button></div>
    <div class="label mb-s">Skiny kota 🐱</div>
    <div class="grid2" style="margin-bottom:1.2rem">${cards}</div>
    <p class="muted tc" style="margin:0 0 1.2rem">⭐ zdobywasz za dobre odpowiedzi i gierki.</p>
  </div>`, { nav: true, tab: 'shop' });
  if (!P.tut.shop) openTut('shop');
}
</script>
<script>
'use strict';
/* ===================== TUTORIAL ===================== */
const TUTS = {
  quiz: [
    { e: '👆', t: 'Dotknij odpowiedź', d: 'Sprawdzę ją od razu. Nie ma przycisku „sprawdź”!' },
    { e: '💗', t: 'Masz 3 serca', d: 'Zła odpowiedź zabiera serce. Dobra daje ⭐ punkty i 🧠 Wiedzę do bazy.' },
    { e: '➡️', t: 'Potem dotknij DALEJ', d: 'Przeczytaj ciekawostkę 💡 i lecimy dalej. Po 5 pytaniach czeka gierka, a potem wracasz do menu.' },
  ],
  base: [
    { e: '🧠🔩☄️', t: 'Trzy zasoby', d: 'Quiz daje 🧠 Wiedzę, a gierki 🔩 Części i ☄️ Meteoryty. Za nie budujesz bazę!' },
    { e: '🏗️', t: 'Buduj na planecie', d: 'Dotknij ＋ i postaw budynek. Budynki same produkują zasoby, nawet gdy nie grasz.' },
    { e: '⭐', t: 'Ulepszaj', d: 'Dotknij budynku, żeby go ulepszyć albo dodać dodatek ☀️ 📡 🫧.' },
    { e: '🪐', t: 'Nowe planety', d: 'Zabuduj całą planetę i zalicz misje, a odblokujesz większą. Droższą, ale z dużo lepszymi zyskami!' },
  ],
  shop: [
    { e: '🛍️', t: 'Sklep', d: 'Za ⭐ z misji kupisz skiny dla kota. Dotknij ZAŁÓŻ, żeby go przebrać.' },
    { e: '💛', t: 'Złote życie', d: 'Kupione złote życie dodaje 4. serce na jedną misję. Włączysz je na ekranie przed startem.' },
  ],
  map: [
    { e: '🐾', t: 'Szlak MeowMission', d: 'Idź tropem kota od 🌱 przez 🔥 do 🚀. Dotknij świecącej misji ze START.' },
    { e: '🔒', t: 'Misje po kolei', d: 'Kolejna misja odblokowuje się po zaliczeniu poprzedniej. Powtórki dają połowę nagród.' },
    { e: '🪐', t: 'Kolonie na szlaku', d: 'Na szlaku czekają nowe planety dla Twojej bazy. Odblokowujesz je misjami, a gierki grasz tylko po misji.' },
  ],
};
let TUT = null;
function openTut(k) { TUT = { k, i: 0 }; renderTut(); }
function renderTut() {
  const old = $('#tut'); if (old) old.remove();
  const list = TUTS[TUT.k], st = list[TUT.i], last = TUT.i === list.length - 1;
  const o = document.createElement('div'); o.id = 'tut'; o.className = 'tutov';
  o.innerHTML = `<div class="tutcard">${cat(last ? 'cheer' : 'idle', 6)}<div style="font-size:2.6rem;margin-top:.3rem">${st.e}</div><h3>${st.t}</h3><p>${st.d}</p>
    <div class="dots mb">${list.map((_, i) => `<i class="${i === TUT.i ? 'on' : ''}"></i>`).join('')}</div>
    <button class="btn ${last ? 'b-mint' : 'b-lav'}" data-act="tut-next">${last ? 'ROZUMIEM 👍' : 'DALEJ ›'}</button>
    ${last ? '' : '<button class="link w100" data-act="tut-skip">pomiń</button>'}</div>`;
  device.appendChild(o);
}
function closeTut() { const o = $('#tut'); if (o) o.remove(); if (TUT) { P.tut[TUT.k] = true; save(); } TUT = null; }
</script>
<script>
'use strict';
/* ===================== ODZNAKI ===================== */
function renderBadges() {
  stopGame(); cur = renderBadges;
  let total = 0;
  const cards = TIERS.flatMap(dk => MISSIONS.map(m => {
    const done = P.done[dk].includes(m.id); if (done) total++;
    return `<div class="card tc" style="${done ? '' : 'opacity:.6'}"><div style="width:4.6rem;height:4.6rem;margin:0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.2rem;background:${done ? m.color : '#EFEAFB'};border:.25rem solid ${done ? (dk === 'easy' ? 'var(--mintd)' : dk === 'mid' ? 'var(--peachd)' : 'var(--pinkd)') : 'transparent'}">${done ? m.icon : '🔒'}</div>
      <div style="font-weight:900;margin-top:.4rem;font-size:.9rem;line-height:1.1">${m.title.replace(/^MeowMission \d: /, '')}</div>
      <div style="font-weight:900;font-size:.72rem;color:${done ? '#2D8F66' : 'var(--muted)'}">${DIFFS[dk].icon} ${DIFFS[dk].name} · ${done ? 'zdobyta!' : 'zablokowana'}</div></div>`;
  })).join('');
  show(`<div class="scr">
    ${bar('<h1 style="font-size:1.8rem;font-weight:900">Odznaki</h1>', '', streakPill())}
    <p class="muted" style="margin:0 0 1rem">Zdobyte: ${total} / ${MISSIONS.length * 3}</p>
    <div class="grid2" style="margin-bottom:1.2rem">${cards}</div></div>`, { nav: true, tab: 'badges' });
}
</script>
<script>
'use strict';
/* ===================== ROUTER + AKCJE ===================== */
function setTab(t) {
  closeSheet();
  ({ home: renderHome, map: renderMap, base: renderBase, shop: renderShop, badges: renderBadges })[t]();
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-ans],[data-act]'); if (!el || el.disabled) return;
  if (el.dataset.ans !== undefined) return answer(+el.dataset.ans);
  const a = el.dataset.act, arg = el.dataset.arg;
  switch (a) {
    case 'diff':        P.diff = arg; P.startIdx = Math.max(P.startIdx, TIERS.indexOf(arg)); save(); return renderHome();
    case 'changediff':  return renderStart();
    case 'tab':         return setTab(arg);
    case 'start-next': {
      const t = nextTarget();
      if (!t.m) return setTab('map');
      useGold = P.golden > 0;
      if (P.diff !== t.tier) { P.diff = t.tier; save(); }
      if (t.promote) { confetti(40, ['🎉', '⭐', '🚀', '🔥']); toast('🎉 Awans! Poziom: ' + DIFFS[t.tier].name); }
      return renderIntro(t.m);
    }
    case 'node': { const [t, id] = arg.split(':'), m = MISSIONS.find(x => x.id == id); if (!nodeOpen(t, m)) return toast('🔒 Najpierw zalicz poprzednią misję', false); P.diff = t; useGold = P.golden > 0; save(); return renderIntro(m, 'map'); }
    case 'goplanet': { const i = +arg; if (!pOpen(i)) return toast('🔒 ' + PLANETS[i].name + ': ' + pReason(i), false); P.planet = i; P.seenPlanets = Math.max(P.seenPlanets, i + 1); save(); closeSheet(); return setTab('base'); }
    case 'togold':      useGold = !useGold; return cur();
    case 'buygold':     if (P.pts < GOLD_PRICE) return toast('Za mało ⭐. Zalicz misję!', false); P.pts -= GOLD_PRICE; P.golden++; save(); confetti(12, ['💛', '✨']); toast('💛 Kupiono złote życie!'); return renderShop();
    case 'buyskin': { const sk = SKINS.find(x => x.id === arg); if (P.pts < sk.p) return toast('Za mało ⭐. Zalicz misję!', false); P.pts -= sk.p; P.skins.push(sk.id); P.skin = sk.id; save(); confetti(24); toast('🎉 Nowy skin: ' + sk.n); return renderShop(); }
    case 'equip':       P.skin = arg; save(); return renderShop();
    case 'tut':         return openTut(arg);
    case 'tut-next':    if (TUT && TUT.i < TUTS[TUT.k].length - 1) { TUT.i++; return renderTut(); } return closeTut();
    case 'tut-skip':    return closeTut();
    case 'start-mission': return startMission(+arg);
    case 'retry':       return startMission(S.m.id);
    case 'check':       return check();
    case 'cont':        return cont();
    case 'play':        return playGame(arg);
    case 'retry-game':  return renderGameIntro(GSET.key);
    case 'skipgame':    stopGame(); return renderMap();
    case 'quitgame':    stopGame(); return renderMap();
    case 'tile': { const [x, y] = arg.split(',').map(Number), t = tileAt(x, y); if (!t) openBuildMenu(x, y); else openBuilding(x, y); return; }
    case 'place':       return placeBuilding(arg);
    case 'upgrade':     return upgradeBuilding();
    case 'slot':        return openAddonPicker();
    case 'addon':       return addAddon(arg);
    case 'sun':         return checkSun();
    case 'sun-demo':    sunInfo = { live: false, demo: true }; flareBoost(); return renderHome();
  }
});
</script>
<script>
'use strict';
/* ===================== START + PĘTLA BAZY ===================== */
load();
renderStart();
probeCat();
let lastTick = Date.now();
setInterval(() => {
  const now = Date.now(), dt = (now - lastTick) / 1000; lastTick = now;
  const r = rates(); for (const k in r) P.res[k] += r[k] * dt;
  const onBase = $('#v-wiedza'), onHome = $('#rv-wiedza');
  if (onBase) updateStats();
  if (onHome) for (const k in RES) { const v = $('#rv-' + k); if (v) v.textContent = fmt(P.res[k]); }
  const bc = $('#boostchip'); if (bc) { if (boostOn()) bc.textContent = `⚡ BOOST ×1.5 · ${Math.ceil((P.boostUntil - now) / 1000)} s`; else bc.remove(); }
  if (onBase) for (const [k, t] of Object.entries(pGrid(P.planet))) {
    if (Math.random() > .2) continue;
    const res = Object.keys(buildingRates(t, P.planet))[0]; if (!res) continue;
    const [x, y] = k.split(',').map(Number), el = $(`#tile-${x}-${y}`); if (!el) continue;
    const f = document.createElement('span'); f.className = 'floatup'; f.textContent = RES[res].icon; el.appendChild(f); setTimeout(() => f.remove(), 1400);
  }
}, 500);
setInterval(save, 5000);
addEventListener('beforeunload', save);
</script>
